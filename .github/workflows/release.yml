name: build & release helper

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      extension_id:
        description: 'Chrome extension ID (host_permissions allowed_origin)'
        required: true
        default: 'replace-me-when-extension-is-published'

permissions:
  contents: write   # for releases

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --release --target x86_64-pc-windows-msvc

      - name: cargo build --release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve extension ID
        id: ext
        shell: bash
        run: |
          ID="${{ github.event.inputs.extension_id }}"
          if [[ -z "$ID" ]]; then
            ID="${{ vars.EXTENSION_ID }}"
          fi
          if [[ -z "$ID" ]]; then
            echo "::error::EXTENSION_ID must be set as workflow input or repo variable" >&2
            exit 1
          fi
          echo "extension_id=$ID" >> "$GITHUB_OUTPUT"

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        working-directory: installer
        run: |
          makensis "/DVERSION=${{ steps.ver.outputs.version }}" "/DEXTENSION_ID=${{ steps.ext.outputs.extension_id }}" w3stream-helper.nsi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: w3stream-helper-setup
          path: installer/w3stream-helper-setup-*.exe
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/w3stream-helper-setup-*.exe
          generate_release_notes: true
