name: build & release helper

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      extension_id:
        description: 'Chrome extension ID (overrides repo variable EXTENSION_ID)'
        required: false
        # Leave blank by default so the resolver step falls back to vars.EXTENSION_ID.
        default: ''

permissions:
  contents: write   # for releases

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --release --target x86_64-pc-windows-msvc

      - name: cargo build --release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          # `version`        — display string; may include -dev.N
          # `file_version`   — strictly X.X.X.X for NSIS VIProductVersion
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"

          # Derive 4-tuple: strip everything after the first non-digit/dot,
          # keep first 3 parts, pad to 4 with .0 or with GITHUB_RUN_NUMBER.
          BASE="${V%%-*}"                         # e.g. 0.1.0
          IFS='.' read -r A B C D <<<"${BASE}"
          A="${A:-0}"; B="${B:-0}"; C="${C:-0}"; D="${D:-0}"
          # Use run number as the 4th component for dev builds so reinstalls
          # show as newer in Windows Add/Remove Programs.
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            D="${GITHUB_RUN_NUMBER}"
          fi
          echo "file_version=${A}.${B}.${C}.${D}" >> "$GITHUB_OUTPUT"

      - name: Resolve extension ID
        id: ext
        shell: bash
        run: |
          ID="${{ github.event.inputs.extension_id }}"
          if [[ -z "$ID" ]]; then
            ID="${{ vars.EXTENSION_ID }}"
          fi
          # Reject the legacy placeholder so a stale workflow run can't slip
          # a manifest with the wrong allowed_origins into a built installer.
          if [[ -z "$ID" || "$ID" == "replace-me-when-extension-is-published" ]]; then
            echo "::error::EXTENSION_ID is empty or placeholder. Pass it as workflow input or set repo variable EXTENSION_ID." >&2
            exit 1
          fi
          echo "extension_id=$ID" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------------
      # Fetch + verify bundled driver installers.
      #
      # URLs and SHA-256 values are PINNED. Bumping a driver version is a
      # deliberate two-step change (update URL + update SHA below);
      # CI fails loudly on mismatch so no auto-latest can sneak into a
      # signed release artifact.
      #
      # Sources:
      #   HidHide  https://github.com/nefarius/HidHide/releases
      #   ViGEmBus https://github.com/nefarius/ViGEmBus/releases
      #
      # To rotate: download the new release manually, run
      #   certutil -hashfile <file> SHA256
      # and update both the URL and the corresponding _SHA256 value below.
      # --------------------------------------------------------------
      - name: Fetch + verify driver installers
        id: drivers
        shell: pwsh
        env:
          HIDHIDE_URL:    'https://github.com/nefarius/HidHide/releases/download/v1.5.230.0/HidHide_1.5.230_x64.msi'
          HIDHIDE_SHA256: 'TODO_FILL_BEFORE_RELEASE_HIDHIDE_SHA256'
          VIGEMBUS_URL:    'https://github.com/nefarius/ViGEmBus/releases/download/v1.22.0/ViGEmBus_1.22.0_x64_x86_arm64.exe'
          VIGEMBUS_SHA256: 'TODO_FILL_BEFORE_RELEASE_VIGEMBUS_SHA256'
        run: |
          $ErrorActionPreference = 'Stop'
          $vendor = Join-Path $PWD 'installer\vendor'
          New-Item -ItemType Directory -Force -Path $vendor | Out-Null

          function FetchAndVerify($url, $sha, $destName) {
            $dest = Join-Path $vendor $destName
            Write-Host "Fetching $url"
            Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing
            $actual = (Get-FileHash -Algorithm SHA256 $dest).Hash.ToLower()
            $expected = $sha.ToLower()
            if ($expected -like 'todo_*') {
              throw "SHA-256 for $destName is a placeholder ($sha). Download the file, run 'certutil -hashfile $destName SHA256', and update release.yml before tagging a release."
            }
            if ($actual -ne $expected) {
              throw "SHA-256 mismatch for $destName`n  expected: $expected`n  actual:   $actual"
            }
            Write-Host "OK $destName ($actual)"
          }

          FetchAndVerify $env:HIDHIDE_URL  $env:HIDHIDE_SHA256  'HidHide.msi'
          FetchAndVerify $env:VIGEMBUS_URL $env:VIGEMBUS_SHA256 'ViGEmBus.exe'

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # Chocolatey installs NSIS to "C:\Program Files (x86)\NSIS\" but does
          # NOT update PATH for the current step's shell. Append the install
          # directory to GITHUB_PATH so subsequent steps can find makensis.exe.
          $nsisDir = 'C:\Program Files (x86)\NSIS'
          if (-not (Test-Path "$nsisDir\makensis.exe")) {
            throw "makensis.exe not found under $nsisDir after install"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir
          Write-Host "Added $nsisDir to GITHUB_PATH"

      - name: Build installer
        working-directory: installer
        shell: pwsh
        run: |
          makensis "/DVERSION=${{ steps.ver.outputs.version }}" "/DFILE_VERSION=${{ steps.ver.outputs.file_version }}" "/DEXTENSION_ID=${{ steps.ext.outputs.extension_id }}" w3stream-helper.nsi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: w3stream-helper-setup
          path: installer/w3stream-helper-setup-*.exe
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/w3stream-helper-setup-*.exe
          generate_release_notes: true
